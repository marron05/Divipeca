<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White circular background -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" />

  <defs>
    <!-- Top Text Path for "Desde 1990" -->
    <path id="topArcPath" d="M 155,200 A 115,115 0 0,1 345,200" fill="none" />
    <!-- Bottom Text Path for "Rif: J-060038278" -->
    <path id="bottomArcPath" d="M 140,305 A 125,125 0 0,0 360,305" fill="none" />
  </defs>

  <!-- Central Badge Outline Container -->
  <!-- Left Half: Green border (#0B7A36) -->
  <path
    d="M 250,140 
       A 110,110 0 0,0 152,185 
       L 60,185 
       A 45,45 0 0,0 60,315 
       L 152,315 
       A 110,110 0 0,0 250,360"
    fill="none"
    stroke="#0B7A36"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Half: Red border (#D32F2F) -->
  <path
    d="M 250,140 
       A 110,110 0 0,1 348,185 
       L 440,185 
       A 45,45 0 0,1 440,315 
       L 348,315 
       A 110,110 0 0,1 250,360"
    fill="none"
    stroke="#D32F2F"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top Arc Text: "Desde 1990" -->
  <text font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" font-style="italic" fill="#111111" text-anchor="middle">
    <textPath href="#topArcPath" startOffset="50%">
      Desde 1990
    </textPath>
  </text>

  <!-- Center Wordmark: "DIVIPECA" -->
  <text
    x="250"
    y="275"
    font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
    font-size="62"
    font-weight="900"
    font-style="italic"
    letter-spacing="4"
    fill="#111111"
    text-anchor="middle"
  >
    DIVIPECA
  </text>

  <!-- Bottom Arc Text: "Rif: J-060038278" -->
  <text font-family="'Times New Roman', Georgia, serif" font-size="30" font-weight="bold" font-style="italic" fill="#111111" text-anchor="middle">
    <textPath href="#bottomArcPath" startOffset="50%">
      Rif: J-060038278
    </textPath>
  </text>
</svg>
